[project]
name = "cryptora"
version = "2.0.0"
description = "A Telegram bot that retrieves cryptocurrency data and news on demand."
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "feedparser>=6.0",
    "mistralai>=2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.16"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    # Cryptora parses dates that are deliberately naive: a calendar day, not an instant.
    "DTZ007",
    # The Mistral client can raise anything; routing must degrade rather than crash.
    "BLE001",
    # A word list reads better as "one two three".split() than as twenty quoted lines.
    "SIM905",
]
